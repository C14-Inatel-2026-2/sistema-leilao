[tool.poetry]
name = "sistema-leilao"
version = "0.1.0"
description = "Marketplace de anúncios com módulo de leilão integrado"
authors = []
readme = "README.md"
packages = [
    { include = "domain" },
    { include = "use_cases" },
    { include = "adapters" },
    { include = "infra" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg2-binary = "^2.9"
apscheduler = "^3.11"
pyjwt = "^2.10"
pydantic = {extras = ["email"], version = "^2.10"}
pydantic-settings = "^2.6"
python-multipart = "^0.0.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^6.0"
httpx = "^0.28"

[tool.poetry.group.celery]
optional = true

[tool.poetry.group.celery.dependencies]
celery = "^5.4"
redis = "^5.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["domain", "use_cases", "adapters", "infra"]
omit = ["tests/*"]
# Caminhos relativos no coverage.xml: o relatorio e gerado no container
# (/app), e o Jenkins rejeita caminhos fora do seu workspace.
relative_files = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
