[tool.poetry]
name = "sistema-leilao"
version = "0.1.0"
description = "Marketplace de anúncios com módulo de leilão integrado"
authors = []
readme = "README.md"
packages = [
    { include = "domain" },
    { include = "use_cases" },
    { include = "adapters" },
    { include = "infra" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.143"
starlette = ">=1.3.1"
uvicorn = {extras = ["standard"], version = "^0.32"}
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg2-binary = "^2.9"
apscheduler = "^3.11"
pyjwt = "^2.14"
pydantic = {extras = ["email"], version = "^2.10"}
pydantic-settings = "^2.6"
python-multipart = ">=0.0.30"
bcrypt = "^5.0.0"
mako = ">=1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^6.0"
httpx = "^0.28"
ruff = "0.17.3"
taskipy = "^1.14.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["domain", "use_cases", "adapters", "infra"]
omit = ["tests/*"]
# Caminhos relativos no coverage.xml: o relatorio e gerado no container
# (/app), e o Jenkins rejeita caminhos fora do seu workspace.
relative_files = true

[tool.ruff]
target-version = "py311"
line-length = 79
# migrations: codigo gerado pelo Alembic. tools: scripts auxiliares, fora do
# pipeline (o stage de lint analisa so o codigo da aplicacao e os testes).
# docs: o preview formataria codigo dentro dos .md, inclusive as transcricoes
# de conversas com IA, que sao registros literais.
extend-exclude = ["migrations", "tools", "docs"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.taskipy.tasks]
lint = { cmd = "ruff check . && ruff format --check .", help = "verifica lint e formatacao (ruff)" }
format = { cmd = "ruff format . && ruff check --fix .", help = "aplica formatacao e correcoes do ruff" }
test = { cmd = "pytest -q", help = "roda a suite de testes" }
coverage = { cmd = "pytest -q --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml", help = "testes com cobertura, no mesmo formato do CI" }
check = { cmd = "task lint && task test", help = "lint e testes" }
api = { cmd = "uvicorn infra.api.app:create_app --factory --reload", help = "sobe a API em modo desenvolvimento" }
db-up = { cmd = "docker compose up -d", help = "sobe o PostgreSQL" }
db-down = { cmd = "docker compose down", help = "derruba o PostgreSQL" }
migrate = { cmd = "alembic upgrade head", help = "aplica as migrations ate o head" }
revision = { cmd = "alembic revision --autogenerate", help = "gera uma migration; passe -- -m \"mensagem\"" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
